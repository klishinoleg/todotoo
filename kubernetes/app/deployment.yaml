apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: todotoo-app:latest
          imagePullPolicy: Never
          command: ["python", "app/interfaces/fast_api/pod_run.py"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: app-env
